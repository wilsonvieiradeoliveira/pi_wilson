<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Cartão de Visita{% endblock %} — Wilson Oliveira</title>
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Verdana, sans-serif;
            color: #222;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #1f3a5f;
            padding: 14px 20px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-right: 18px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .destaque {
            color: #1f3a5f;
            font-weight: bold;
        }

        footer {
            text-align: center;
            font-size: 0.85em;
            color: #666;
            margin: 20px 0;
        }

        {% block estilo %}{% endblock %}
    </style>
</head>
<body>
    <nav>
        <a href="/">Início</a>
        <a href="/sobre">Sobre</a>
        <a href="/hobbies">Hobbies</a>
        <a href="/futuro">Futuro</a>
        <a href="/contato">Contato</a>
    </nav>

    <main>
        {% block conteudo %}{% endblock %}
    </main>

    <footer>
        <p>Cartão de visita &mdash; Módulo 3 &mdash; Programação para Internet</p>
    </footer>
</body>
</html>
