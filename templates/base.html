<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Cartão de Visita{% endblock %} — {{name}}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}"> -->
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Minha Loja</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">Início</a>
                <a class="nav-link" href="/sobre">Sobre</a>
                <a class="nav-link" href="/hobbies">Hobbies</a>
                <a class="nav-link" href="/futuro">Futuro</a>
                <a class="nav-link" href="/contato">Contato</a>
                <a class="nav-link" href="/produto">Produto</a>
                <a class="nav-link" href="/catalago">Catálogo</a>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block conteudo %}{% endblock %}
    </main>

    <footer class="text-center text-muted py-3 mt-4">
        <p>Cartão de visita &mdash; Módulo 3 &mdash; Programação para Internet</p>
    </footer>
</body>
</html>
