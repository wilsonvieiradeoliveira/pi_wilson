{% extends "base.html" %}

{% block conteudo %}
    {% if erro %}
        <p>{{ erro }}</p>
    {% endif %}
    <form method="post">
      <input class="form-control" name="nome" value="{{ produto.nome }}">
      <input class="form-control" name="preco" value="{{ produto.preco }}">
      <input class="form-control" name="estoque"
             value="{{ produto.estoque }}">
      <button type="submit">Salvar</button>
    </form>
{% endblock %}
