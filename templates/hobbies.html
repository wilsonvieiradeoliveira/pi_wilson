{% extends "base.html" %}

{% block titulo %}Hobbies{% endblock %}

{% block conteudo %}
    <h1>Meus hobbies</h1>
    {% if hobbies %}
        <ul>
        {% for item in hobbies %}
            <li>{{ item }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Nenhum hobby cadastrado ainda.</p>
    {% endif %}
{% endblock %}
